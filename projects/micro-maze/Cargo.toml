[package]
name = "micro-maze"
version = "0.1.0"
edition = "2024"
description = "A learning project rendering a maze on a microcontroller display."
publish = false

[[bin]]
bench = false
name = "micro-maze"
test = false

[dependencies]
embedded-graphics.workspace = true
heapless.workspace = true
rand.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
display-interface.workspace = true
microbit-input = { workspace = true, features = ["hardware"] }
microbit-v2.workspace = true
nrf52833-hal.workspace = true
panic-rtt-target.workspace = true
rtt-target.workspace = true
ssd1306.workspace = true

[lints]
workspace = true
