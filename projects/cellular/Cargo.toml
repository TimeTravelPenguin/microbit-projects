[package]
name = "cellular"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
bench = false
name = "cellular"
test = false

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
embassy-executor.workspace = true
embassy-nrf = { workspace = true, features = ["rt"] }
embassy-time.workspace = true
embedded-graphics.workspace = true
heapless.workspace = true
kitronik-view = { workspace = true, features = ["async"] }
microbit-input = { workspace = true, features = ["async"] }
panic-rtt-target.workspace = true
rtt-target.workspace = true

[target.'cfg(not(target_name = "thumbv7em-none-eabihf"))'.dependencies]
embedded-graphics-simulator = { workspace = true, optional = true }

[features]
default = []
simulator = ["dep:embedded-graphics-simulator"]

[lints]
workspace = true
