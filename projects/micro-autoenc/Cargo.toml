[package]
name = "micro-autoenc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", optional = true }
burn = {
  version = "=0.22.0-pre.4",
  default-features = false,
  features = ["flex"],
}
hound = { version = "3.5", optional = true }
rand = { version = "0.10", optional = true }
polars = {
  version = "0.55",
  default-features = false,
  optional = true,
  features = [
    "dtype-struct",
    "parquet",
  ],
}

[features]
default = ["train"]
train = [
  "dep:anyhow",
  "dep:hound",
  "dep:polars",
  "dep:rand",
  "burn/extension",
  "burn/metal",
  "burn/metrics",
  "burn/std",
  "burn/train",
  "burn/tui",
]

[[bin]]
name = "micro-autoenc"
path = "src/main.rs"
required-features = ["train"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
