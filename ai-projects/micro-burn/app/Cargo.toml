[package]
name = "micro-burn-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "flex", "train", "store"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "canvas", "tokio"] }
micro-burn = { path = "../lib", features = ["burn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
