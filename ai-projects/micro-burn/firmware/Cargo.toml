[package]
name = "micro-burn-firmware"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "micro-burn-firmware"
test = false
bench = false

[dependencies]
micro-burn = { path = "../lib", default-features = false }
embedded-graphics = "0.8.2"
heapless = "0.9.3"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7.10", default-features = false }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", default-features = false, features = ["executor-thread", "platform-cortex-m"] }
embassy-nrf = { version = "0.11.0", default-features = false, features = ["nrf52833", "time-driver-rtc1", "rt", "unstable-pac"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
kitronik-view = { path = "../../../crates/kitronik-view", default-features = false, features = ["async"] }
microbit-input = { path = "../../../crates/microbit-input", default-features = false }
nrf-sdc = { version = "=0.4.0", default-features = false, features = ["nrf52833", "peripheral"] }
nrf-mpsl = { version = "=0.4.0", default-features = false, features = ["nrf52833", "critical-section-impl"] }
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"
static_cell = "2.1.0"
trouble-host = { version = "=0.8.0", default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool", "default-packet-pool-mtu-128", "default-packet-pool-size-8"] }
