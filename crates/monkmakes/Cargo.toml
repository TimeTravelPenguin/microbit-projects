[package]
name = "monkmakes"
version = "0.1.0"
edition = "2024"

[[example]]
name = "full_async"
required-features = ["async", "sensor", "seven_seg"]

[[example]]
name = "seven_segment_blocking"
required-features = ["blocking", "seven_seg"]

[[example]]
name = "seven_segment_async"
required-features = ["async", "seven_seg"]

[[example]]
name = "sensor_board_blocking"
required-features = ["blocking", "sensor"]

[[example]]
name = "sensor_board_async"
required-features = ["async", "sensor"]

[dependencies]
embassy-nrf = { workspace = true, optional = true }
libm = { workspace = true, optional = true }
# Leave interrupt-vector selection to the application instead of inheriting rt.
nrf52833-hal = { version = "0.19.0", default-features = false, optional = true }
thiserror.workspace = true

[target.'cfg(target_os = "none")'.dev-dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
embassy-executor.workspace = true
# Embassy supplies the examples' shared interrupt table and timer handler.
embassy-nrf = { workspace = true, features = ["rt"] }
embassy-time.workspace = true
heapless.workspace = true
microbit-input.workspace = true
panic-rtt-target.workspace = true
rtt-target.workspace = true

[features]
default = ["blocking"]
async = ["dep:embassy-nrf"]
blocking = ["dep:nrf52833-hal"]
sensor = ["dep:libm"]
seven_seg = []

[lints]
workspace = true
