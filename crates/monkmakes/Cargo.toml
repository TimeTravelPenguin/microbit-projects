[package]
name = "monkmakes"
version = "0.1.0"
edition = "2024"

[[example]]
name = "seven_segment_blocking"
required-features = ["blocking", "seven_seg"]

[dependencies]
embassy-nrf = { workspace = true, optional = true }
embedded-hal = { workspace = true, optional = true }
embedded-hal-async = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
nrf52833-hal = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
heapless.workspace = true
panic-rtt-target.workspace = true
rtt-target.workspace = true

[features]
default = ["blocking"]
async = ["dep:embassy-nrf", "dep:embedded-hal-async", "dep:embedded-io-async"]
blocking = ["dep:embedded-hal", "dep:embedded-io", "dep:nrf52833-hal"]
sensor = []
seven_seg = []

[lints]
workspace = true
