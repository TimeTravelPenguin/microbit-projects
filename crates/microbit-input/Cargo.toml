[package]
name = "microbit-input"
version = "0.1.0"
edition = "2024"
description = "Interrupt-driven button sampling for micro:bit V2"

[features]
default = []
hardware = ["dep:cortex-m", "dep:embedded-hal", "dep:microbit-v2"]

[dependencies]
