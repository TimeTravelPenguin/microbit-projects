[package]
name = "kitronik-view"
version = "0.1.0"
edition = "2024"
description = "Blocking and async OLED setup for the Kitronik :VIEW"

[[example]]
name = "display_blocking"
required-features = ["blocking"]

[[example]]
name = "display_async"
required-features = ["async"]

[dependencies]
display-interface.workspace = true
embedded-hal = { workspace = true, optional = true }
embedded-hal-async = { workspace = true, optional = true }
ssd1306.workspace = true

[target.'cfg(target_os = "none")'.dev-dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
embassy-executor.workspace = true
# Both examples use Embassy's interrupt table; the blocking HAL leaves rt disabled.
embassy-nrf = { workspace = true, features = ["rt"] }
embassy-time.workspace = true
embedded-graphics.workspace = true
heapless.workspace = true
nrf52833-hal = { version = "0.19.0", default-features = false }
panic-rtt-target.workspace = true
rtt-target.workspace = true

[features]
default = ["blocking"]
async = ["dep:embedded-hal-async", "ssd1306/async"]
blocking = ["dep:embedded-hal"]

[lints]
workspace = true
